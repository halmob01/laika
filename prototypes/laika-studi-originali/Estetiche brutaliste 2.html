<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAIKA — Studio Grafico: Palazzi Brutalisti (Fase B)</title>
  <style>
    :root {
      --bg: #F6F1E3;
      --ink: #161614;
      --red: #E02A1B;
      --blue-light: #C9D6DF;
      --blue-mid: #8EA8B8;
      --blue-dark: #4F6B7C;
      --panel: #EFE8D5;
      --border: #C8BEA6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--ink);
      color: var(--bg);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--red);
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      font-size: 16px;
    }
    .brand span.red { color: var(--red); }
    .mode-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: #2b2b28;
      color: var(--bg);
      border: 1px solid #555;
      padding: 7px 14px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      font-size: 12px;
      border-radius: 3px;
      transition: 0.15s;
    }
    .tab-btn.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .main-layout {
      display: grid;
      grid-template-columns: 360px 1fr 310px;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sidebar-right {
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 3px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--ink);
      padding: 4px 8px;
      margin: -10px -10px 8px -10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title span.badge {
      background: var(--red);
      padding: 1px 5px;
      font-size: 10px;
      border-radius: 2px;
    }
    .grid-btns {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    button.opt-btn {
      background: #fff;
      border: 1px solid var(--border);
      padding: 6px 7px;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      border-radius: 2px;
      transition: 0.1s;
      color: var(--ink);
    }
    button.opt-btn:hover {
      border-color: var(--ink);
      background: #faf6eb;
    }
    button.opt-btn.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }
    .canvas-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto;
      background: radial-gradient(circle, #fbf8f0 0%, #e7dec8 100%);
    }
    #svg-container {
      background: var(--bg);
      border: 2px solid var(--ink);
      box-shadow: 0 10px 28px rgba(0,0,0,0.14);
      max-width: 100%;
      max-height: 84vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #svg-container svg {
      display: block;
      max-width: 100%;
      max-height: 82vh;
    }
    textarea#svg-code {
      width: 100%;
      height: 150px;
      font-family: monospace;
      font-size: 10px;
      background: #161614;
      color: #f6f1e3;
      border: 1px solid var(--border);
      padding: 6px;
      resize: vertical;
    }
    .action-btn {
      width: 100%;
      padding: 9px;
      background: var(--red);
      color: #fff;
      border: none;
      font-family: inherit;
      font-weight: bold;
      font-size: 11.5px;
      cursor: pointer;
      border-radius: 3px;
      margin-top: 5px;
    }
    .action-btn.secondary { background: var(--ink); }
    .action-btn.blue { background: var(--blue-dark); }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: bold;
      margin: 5px 0;
      cursor: pointer;
    }
    #png-preview {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span>STUDIO GRAFICO — <span class="red">PALAZZI BRUTALISTI</span> (FASE B)</span>
  </div>
  <div class="mode-tabs">
    <button class="tab-btn active" id="tab-single" onclick="setViewMode('single')">1. ISPEZIONA SINGOLO PALAZZO (15 EDIFICI)</button>
    <button class="tab-btn" id="tab-poster" onclick="setViewMode('poster')">2. TAVOLA INTEGRALE PALAZZI (4 RIGHE)</button>
  </div>
</header>

<div class="main-layout">
  <div class="sidebar">
    <div class="section-box">
      <div class="section-title">Riga 1 — Residenziale (4 Asset) <span class="badge">R1</span></div>
      <div class="grid-btns" id="btns-r1"></div>
    </div>

    <div class="section-box">
      <div class="section-title">Riga 2 — Istituzionale (4 Asset) <span class="badge">R2</span></div>
      <div class="grid-btns" id="btns-r2"></div>
    </div>

    <div class="section-box">
      <div class="section-title">Riga 3 — Gradoni & Pilotis (4 Asset) <span class="badge">R3</span></div>
      <div class="grid-btns" id="btns-r3"></div>
    </div>

    <div class="section-box">
      <div class="section-title">Riga 4 — Casa della Cultura (3 Asset) <span class="badge">R4</span></div>
      <div class="grid-btns" id="btns-r4"></div>
    </div>

    <div class="section-box">
      <div class="section-title">Opzioni Scena & Animazione</div>
      <label class="checkbox-row">
        <input type="checkbox" id="chk-people" checked onchange="renderAll()" />
        👥 Mostra Omini, Alberi e Cane in Scala
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="chk-texture" checked onchange="renderAll()" />
        🧱 Texture Casseri & Macchie Cemento
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="chk-rough" checked onchange="renderAll()" />
        🖍️ Tratto Inchiostro Ruvido (Filtro SVG)
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="chk-anim" onchange="toggleAnim(this.checked)" />
        🌬️ Anima Passanti e Bandiere Rosse
      </label>
    </div>
  </div>

  <div class="canvas-area">
    <div id="svg-container"></div>
  </div>

  <div class="sidebar-right">
    <div class="section-box">
      <div class="section-title">Anteprima PNG Generata</div>
      <img id="png-preview" alt="Anteprima PNG" />
      <button class="action-btn" onclick="downloadPNG()">⬇ SCARICA PNG AD ALTA RISOLUZIONE</button>
    </div>

    <div class="section-box">
      <div class="section-title">Codice SVG Vettoriale Puro</div>
      <textarea id="svg-code" readonly></textarea>
      <button class="action-btn secondary" onclick="copySVG()">📋 COPIA CODICE SVG</button>
      <button class="action-btn blue" onclick="downloadSVG()">⬇ SCARICA FILE .SVG</button>
    </div>
  </div>
</div>

<script>
const C = {
  bg: '#F6F1E3',
  ink: '#161614',
  red: '#E02A1B',
  cLight: '#C9D6DF',
  cMid: '#8EA8B8',
  cDark: '#4F6B7C',
  treeBlue: '#97B0C0'
};

const BUILDINGS = {
  r1: [
    { id: 'torre_residenziale',     label: 'Torre residenziale', w: 260 },
    { id: 'torre_residenziale_var', label: 'Torre resid. (Variante)', w: 220 },
    { id: 'blocco_abitativo',       label: 'Blocco abitativo', w: 480 },
    { id: 'blocco_abitativo_var',   label: 'Blocco abit. (Variante)', w: 260 }
  ],
  r2: [
    { id: 'palazzo_amministrativo',     label: 'Palazzo amministrativo', w: 420 },
    { id: 'palazzo_amministrativo_var', label: 'Palazzo amm. (Variante)', w: 210 },
    { id: 'centro_civico',              label: 'Centro civico', w: 430 },
    { id: 'centro_civico_var',          label: 'Centro civico (Variante)', w: 240 }
  ],
  r3: [
    { id: 'complesso_gradoni',     label: 'Complesso a gradoni', w: 410 },
    { id: 'complesso_gradoni_var', label: 'Gradoni (Variante)', w: 250 },
    { id: 'edificio_pilotis',      label: 'Edificio con pilotis', w: 380 },
    { id: 'edificio_pilotis_var',  label: 'Pilotis (Variante)', w: 250 }
  ],
  r4: [
    { id: 'casa_cultura',       label: 'Casa della Cultura', w: 500 },
    { id: 'casa_cultura_var1',  label: 'Casa Cultura (Variante 1)', w: 360 },
    { id: 'casa_cultura_var2',  label: 'Casa Cultura (Variante 2)', w: 350 }
  ]
};

const state = {
  viewMode: 'single',
  activeId: 'blocco_abitativo',
  anim: false,
  tick: 0
};

function initUI() {
  ['r1', 'r2', 'r3', 'r4'].forEach(rowKey => {
    const box = document.getElementById(`btns-${rowKey}`);
    BUILDINGS[rowKey].forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn' + (b.id === state.activeId ? ' active' : '');
      btn.dataset.id = b.id;
      btn.textContent = b.label;
      btn.onclick = () => {
        state.activeId = b.id;
        if (state.viewMode !== 'single') setViewMode('single');
        syncUI();
        renderAll();
      };
      box.appendChild(btn);
    });
  });
}

function setViewMode(m) {
  state.viewMode = m;
  document.getElementById('tab-single').classList.toggle('active', m === 'single');
  document.getElementById('tab-poster').classList.toggle('active', m === 'poster');
  renderAll();
}

function syncUI() {
  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === state.activeId);
  });
}

function toggleAnim(on) {
  state.anim = on;
  renderAll();
}

function getDefs(withTexture) {
  return `
    <defs>
      <filter id="brutal-ink" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="2" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <pattern id="concrete-tex" width="64" height="64" patternUnits="userSpaceOnUse">
        ${withTexture ? `
          <circle cx="14" cy="18" r="0.9" fill="${C.ink}" opacity="0.32"/>
          <circle cx="46" cy="12" r="0.8" fill="${C.ink}" opacity="0.28"/>
          <circle cx="29" cy="40" r="1.0" fill="${C.ink}" opacity="0.24"/>
          <circle cx="52" cy="50" r="0.8" fill="${C.ink}" opacity="0.32"/>
          <path d="M 8,24 L 8,36 M 38,16 L 38,30 M 54,26 L 54,42" stroke="${C.cDark}" stroke-width="0.65" opacity="0.38"/>
        ` : ''}
      </pattern>
    </defs>
  `;
}

// === HELPER: BLOCCO 3D IN CALCESTRUZZO ===
function box3D(x, y, w, h, dx = 16, dy = -8, topVis = true, rightVis = true, frontColor = C.cLight, sideColor = C.cMid) {
  let s = `<g stroke="${C.ink}" stroke-width="1.25" stroke-linejoin="round">`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${frontColor}"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#concrete-tex)" stroke="none"/>`;
  if (topVis && dy < 0) {
    s += `<polygon points="${x},${y} ${x + dx},${y + dy} ${x + w + dx},${y + dy} ${x + w},${y}" fill="${C.bg}" opacity="0.9"/>`;
    s += `<polygon points="${x},${y} ${x + dx},${y + dy} ${x + w + dx},${y + dy} ${x + w},${y}" fill="${C.cLight}" opacity="0.55"/>`;
  } else if (!topVis && dy > 0) {
    s += `<polygon points="${x},${y + h} ${x + dx},${y + h + dy} ${x + w + dx},${y + h + dy} ${x + w},${y + h}" fill="${C.ink}"/>`;
  }
  if (rightVis && dx !== 0) {
    s += `<polygon points="${x + w},${y} ${x + w + dx},${y + dy} ${x + w + dx},${y + h + dy} ${x + w},${y + h}" fill="${sideColor}"/>`;
    s += `<polygon points="${x + w},${y} ${x + w + dx},${y + dy} ${x + w + dx},${y + h + dy} ${x + w},${y + h}" fill="url(#concrete-tex)" stroke="none"/>`;
  }
  s += `</g>`;
  return s;
}

// === HELPER: OMINI, CANE E ALBERI STILIZZATI ===
function person(x, y, opts = {}) {
  const sc = (opts.child ? 0.65 : 1) * (opts.scale || 0.85);
  const col = opts.red ? C.red : C.ink;
  const sw = state.anim ? Math.sin(state.tick + x * 0.1) * 4.5 : (opts.walk ? 3.5 : 0);
  const dx = state.anim && opts.walk ? Math.sin(state.tick * 0.5 + x) * 3 : 0;
  return `
    <g transform="translate(${x + dx}, ${y}) scale(${sc})">
      <circle cx="0" cy="-22" r="2.7" fill="${col}"/>
      ${opts.woman
        ? `<polygon points="-2.2,-19 2.2,-19 4.6,-7 -4.6,-7" fill="${col}"/>`
        : `<polygon points="-2.4,-19 2.4,-19 2.7,-9 -2.7,-9" fill="${col}"/>`
      }
      <line x1="-2" y1="-17.5" x2="${-4 - sw * 0.3}" y2="-10" stroke="${col}" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="2" y1="-17.5" x2="${4 + sw * 0.3}" y2="-10" stroke="${col}" stroke-width="1.7" stroke-linecap="round"/>
      <line x1="-1.2" y1="-9" x2="${-2.3 - sw * 0.4}" y2="0" stroke="${col}" stroke-width="1.9" stroke-linecap="round"/>
      <line x1="1.2" y1="-9" x2="${2.3 + sw * 0.4}" y2="0" stroke="${col}" stroke-width="1.9" stroke-linecap="round"/>
    </g>
  `;
}

function dog(x, y, scale = 0.9) {
  return `
    <g transform="translate(${x}, ${y}) scale(${scale})">
      <path d="M -7,-5.5 L 4,-5.5 L 6.5,-10 L 8.5,-13 L 9.5,-10 L 12,-8.5 L 11,-6.5 L 7.5,-6.5 L 5.5,-3.5 L 7,0 L 5.2,0 L 3.5,-3.5 L -4.5,-3.5 L -6.5,0 L -8.2,0 L -6.5,-4.5 Z" fill="${C.ink}"/>
      <path d="M -7,-5.5 Q -10.5,-8.5 -9.5,-11.5" fill="none" stroke="${C.ink}" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="4.5" y1="-7" x2="7.5" y2="-5" stroke="${C.red}" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  `;
}

function stylizedTree(x, y, scale = 1, bare = false) {
  let s = `<g transform="translate(${x}, ${y}) scale(${scale})">`;
  if (!bare) {
    s += `<ellipse cx="0" cy="-24" rx="8.5" ry="16" fill="${C.treeBlue}" opacity="0.65"/>`;
  }
  s += `<path d="M 0,0 L 0,-34 M 0,-14 L -6,-22 M 0,-19 L 6,-27 M 0,-25 L -5,-32 M 0,-28 L 4,-35" stroke="${C.ink}" stroke-width="1.2" stroke-linecap="round" fill="none"/>`;
  s += `</g>`;
  return s;
}

// === DISEGNATORE DEI 15 PALAZZI BRUTALISTI ===
function drawBuilding(id, ox = 0, oy = 0, showPeople = true) {
  let g = `<g transform="translate(${ox}, ${oy})">`;
  const groundY = 176;
  const flagWave = state.anim ? Math.sin(state.tick * 2) * 3.5 : 0;

  switch (id) {
    // ================= 1. TORRE RESIDENZIALE =================
    case 'torre_residenziale':
      g += `<line x1="6" y1="${groundY}" x2="250" y2="${groundY}" stroke="${C.ink}" stroke-width="1.5"/>`;
      // Pilotis di base
      [58, 76, 98, 120, 140, 158].forEach((px, i) => {
        g += `<rect x="${px}" y="${groundY - 22}" width="7" height="22" fill="${i % 2 === 0 ? C.cLight : C.ink}" stroke="${C.ink}" stroke-width="1.1"/>`;
      });
      // Balconi sporgenti a sinistra (8 piani)
      for (let f = 0; f < 8; f++) {
        const fy = 26 + f * 15.5;
        g += box3D(46, fy, 22, 6, 4, 2, false, false, C.cLight, C.cMid);
        g += `<rect x="50" y="${fy - 5}" width="16" height="5" fill="${C.ink}"/>`;
      }
      // Corpo principale della torre
      g += box3D(68, 18, 48, 136, 14, -6, true, true, C.cLight, C.cMid);
      // Colonna centrale di logge scure
      for (let f = 0; f < 8; f++) {
        const fy = 24 + f * 15.5;
        g += `<rect x="84" y="${fy}" width="14" height="10" fill="${C.ink}"/>`;
        g += `<rect x="86" y="${fy + 6}" width="14" height="4" fill="${C.cMid}" stroke="${C.ink}" stroke-width="0.9"/>`;
      }
      // Ala destra arretrata
      g += box3D(128, 22, 34, 132, 16, -6, true, true, C.cMid, C.cDark);
      for (let f = 0; f < 8; f++) {
        const fy = 28 + f * 15.5;
        g += `<rect x="138" y="${fy}" width="5" height="7" fill="${C.ink}"/>`;
        g += `<rect x="152" y="${fy}" width="5" height="7" fill="${C.ink}"/>`;
      }
      // Volumi tecnici sul tetto
      g += box3D(80, 10, 26, 8, 8, -4, true, true);
      if (showPeople) {
        g += stylizedTree(24, groundY, 0.95, true);
        g += stylizedTree(218, groundY, 0.85, true);
        g += person(18, groundY, { scale: 0.78 });
        g += person(92, groundY, { scale: 0.75 });
        g += person(186, groundY, { walk: true, scale: 1.05 });
        g += person(200, groundY, { child: true, walk: true, scale: 0.95 });
      }
      break;

    case 'torre_residenziale_var':
      g += `<line x1="6" y1="${groundY}" x2="210" y2="${groundY}" stroke="${C.ink}" stroke-width="1.5"/>`;
      // Pilotis
      [54, 72, 92, 114, 132].forEach((px, i) => {
        g += `<rect x="${px}" y="${groundY - 18}" width="7" height="18" fill="${i % 2 === 0 ? C.cLight : C.ink}" stroke="${C.ink}" stroke-width="1.1"/>`;
      });
      // Balconi sinistri
      for (let f = 0; f < 6; f++) {
        const fy = 46 + f * 18;
        g += box3D(42, fy, 18, 6, 4, 2, false, false);
        g += `<rect x="45" y="${fy - 5}" width="14" height="5" fill="${C.ink}"/>`;
      }
      // Corpo sinistro e corpo destro con accenti rossi
      g += box3D(60, 38, 36, 120, 10, -5, true, true, C.cLight, C.cMid);
      g += box3D(102, 30, 38, 128, 16, -7, true, true, C.cLight, C.cMid);
      for (let f = 0; f < 6; f++) {
        const fy = 42 + f * 18;
        g += `<rect x="74" y="${fy}" width="6" height="9" fill="${C.ink}"/>`;
        g += `<rect x="116" y="${fy - 4}" width="6" height="9" fill="${C.ink}"/>`;
        // Logge rosse sul fianco destro
        if (f === 1 || f === 3 || f === 4) {
          g += `<rect x="142" y="${fy - 4}" width="8" height="7" fill="${C.red}" stroke="${C.ink}" stroke-width="0.8"/>`;
        }
      }
      if (showPeople) {
        g += person(32, groundY, { scale: 0.8 });
        g += person(98, groundY, { walk: true, scale: 0.8 });
        g += person(166, groundY, { scale: 0.85 });
      }
      break;

    // ================= 2. BLOCCO ABITATIVO (STECCA MONUMENTALE) =================
    case 'blocco_abitativo':
      g += `<line x1="6" y1="${groundY}" x2="474" y2="${groundY}" stroke="${C.ink}" stroke-width="1.5"/>`;
      // Pilotis massicci al piano terra
      for (let i = 0; i < 11; i++) {
        const px = 42 + i * 34;
        g += `<rect x="${px + 6}" y="${groundY - 26}" width="14" height="26" fill="${C.ink}"/>`;
        g += box3D(px, groundY - 26, 12, 26, 6, -3, false, true, C.cLight, C.cMid);
      }
      // Grande stecca principale con 5 campate di balconi e torri scala intercalate
      g += box3D(38, 34, 345, 116, 42, -14, true, true, C.cLight, C.cMid);
      // Setti verticali sporgenti che dividono le 5 campate
      [38, 102, 168, 234, 302, 368].forEach(sx => {
        g += box3D(sx, 24, 14, 126, 8, -4, true, true, C.cLight, C.cMid);
      });
      // 6 Piani di balconi a nastro con alcune tende da sole rosse (#E02A1B)
      const redAwnings = ['1-2', '2-1', '3-2', '3-4', '4-3'];
      for (let bay = 0; bay < 5; bay++) {
        const bx = 54 + bay * 66;
        for (let fl = 0; fl < 6; fl++) {
          const fy = 40 + fl * 17.5;
          g += `<rect x="${bx}" y="${fy}" width="46" height="10" fill="${C.ink}"/>`;
          g += `<rect x="${bx - 1}" y="${fy + 8}" width="48" height="4.5" fill="${C.cLight}" stroke="${C.ink}" stroke-width="0.9"/>`;
          if (redAwnings.includes(`${bay}-${fl}`)) {

      ${person(88, 0, { woman: true, scale: 1.25 })}

      ${person(148, 0, { red: true, woman: true, scale: 1.3 })}
      ${dog(182, 0, 1.3)}
      <text x="90" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="${C.ink}">SCALA PERSONAGGI</text>
    </g>
  `;

  // RIGA 1: TORRE RESIDENZIALE + VARIANTE | BLOCCO ABITATIVO + VARIANTE
  svg += `<g ${filterAttr} transform="translate(0, 96)">
    <text x="32" y="20" font-family="monospace" font-size="15" font-weight="900" letter-spacing="1.5" fill="${C.ink}">TORRE RESIDENZIALE</text>
    ${drawBuilding('torre_residenziale', 24, 24, showPeople)}
    <text x="415" y="42" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="${C.ink}">VARIANTE</text>
    ${drawBuilding('torre_residenziale_var', 310, 24, showPeople)}

    <text x="640" y="20" font-family="monospace" font-size="15" font-weight="900" letter-spacing="1.5" fill="${C.ink}">BLOCCO ABITATIVO</text>
    ${drawBuilding('blocco_abitativo', 560, 24, showPeople)}
    <text x="1310" y="42" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="${C.ink}">VARIANTE</text>
    ${drawBuilding('blocco_abitativo_var', 1190, 24, showPeople)}
  </g>`;

  // RIGA 2: PALAZZO AMMINISTRATIVO + VARIANTE | CENTRO CIVICO + VARIANTE
  svg += `<g ${filterAttr} transform="translate(0, 336)">
    <text x="32" y="20" font-family="monospace" font-size="15" font-weight="900" letter-spacing="1.5" fill="${C.ink}">PALAZZO AMMINISTRATIVO</text>
    ${drawBuilding('palazzo_amministrativo', 24, 24, showPeople)}
    <text x="555" y="38" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="${C.ink}">VARIANTE</text>
    ${drawBuilding('palazzo_amministrativo_var', 460, 24, showPeople)}

    <text x="740" y="20" font-family="monospace" font-size="15" font-weight="900" letter-spacing="1.5" fill="${C.ink}">CENTRO CIVICO</text>
    ${drawBuilding('centro_civico', 700, 24, showPeople)}
    <text x="1315" y="42" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="${C.ink}">VARIANTE</text>
    ${drawBuilding('centro_civico_var', 1200, 24, showPeople)}
  </g>`;

  // RIGA 3: COMPLESSO A GRADONI + VARIANTE | EDIFICIO CON PILOTIS + VARIANTE
  svg += `<g ${filterAttr} transform="translate(0, 576)">
    <text x="32" y="20" font-family="monospace" font-size="15" font-weight="900" letter-spacing="1.5" fill="${C.ink}">COMPLESSO A GRADONI</text>
    ${drawBuilding('complesso_gradoni', 24, 24, showPeople)}
    <text x="565" y="42" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="${C.ink}">VARIANTE</text>
    ${drawBuilding('complesso_gradoni_var', 455, 24, showPeople)}

    <text x="780" y="20" font-family="monospace" font-size="15" font-weight="900" letter-spacing="1.5" fill="${C.ink}">EDIFICIO CON PILOTIS</text>
    ${drawBuilding('edificio_pilotis', 745, 24, showPeople)}
    <text x="1315" y="42" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="${C.ink}">VARIANTE</text>
    ${drawBuilding('edificio_pilotis_var', 1195, 24, showPeople)}
  </g>`;

  // RIGA 4: CASA DELLA CULTURA + VARIANTE 1 + VARIANTE 2
  svg += `<g ${filterAttr} transform="translate(0, 816)">
    <text x="32" y="20" font-family="monospace" font-size="15" font-weight="900" letter-spacing="1.5" fill="${C.ink}">CASA DELLA CULTURA</text>
    ${drawBuilding('casa_cultura', 24, 24, showPeople)}
    <text x="720" y="34" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="${C.ink}">VARIANTE</text>
    ${drawBuilding('casa_cultura_var1', 590, 24, showPeople)}
    <text x="1150" y="34" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="${C.ink}">VARIANTE</text>
    ${drawBuilding('casa_cultura_var2', 1020, 24, showPeople)}
  </g>`;

  svg += `</svg>`;
  return svg;
}

function renderAll() {
  const showPeople = document.getElementById('chk-people').checked;
  const withTexture = document.getElementById('chk-texture').checked;
  const useRough = document.getElementById('chk-rough').checked;
  const filterAttr = useRough ? `filter="url(#brutal-ink)"` : '';

  let svgString = '';
  if (state.viewMode === 'poster') {
    svgString = buildFullPalazziPosterSVG(showPeople, withTexture, useRough);
  } else {
    const allB = [...BUILDINGS.r1, ...BUILDINGS.r2, ...BUILDINGS.r3, ...BUILDINGS.r4];
    const item = allB.find(x => x.id === state.activeId) || BUILDINGS.r1[0];
    const W = item.w + 30;
    const H = 225;

    svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" height="100%">`;
    svgString += getDefs(withTexture);
    svgString += `<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
    svgString += `<text x="18" y="24" font-family="monospace" font-size="12" font-weight="900" letter-spacing="1.5" fill="${C.ink}">${item.label.toUpperCase()}</text>`;
    svgString += `<g ${filterAttr}>`;
    svgString += drawBuilding(item.id, 12, 24, showPeople);
    svgString += `</g></svg>`;
  }

  document.getElementById('svg-container').innerHTML = svgString;
  document.getElementById('svg-code').value = svgString;
  updatePNGPreview(svgString);
}

let pngTimer = null;
function updatePNGPreview(svgString) {
  if (pngTimer) clearTimeout(pngTimer);
  pngTimer = setTimeout(() => {
    const img = new Image();
    const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      if (state.viewMode === 'poster') {
        canvas.width = 1600;
        canvas.height = 1136;
      } else {
        canvas.width = 1000;
        canvas.height = 560;
      }
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      document.getElementById('png-preview').src = canvas.toDataURL('image/png');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }, 60);
}

function copySVG() {
  const el = document.getElementById('svg-code');
  el.select();
  navigator.clipboard.writeText(el.value);
}

function downloadSVG() {
  const svgString = document.getElementById('svg-code').value;
  const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `palazzi_brutalisti_${state.viewMode === 'poster' ? 'tavola_completa' : state.activeId}.svg`;
  a.click();
}

function downloadPNG() {
  const src = document.getElementById('png-preview').src;
  if (!src) return;
  const a = document.createElement('a');
  a.href = src;
  a.download = `palazzi_brutalisti_${state.viewMode === 'poster' ? 'tavola_completa' : state.activeId}.png`;
  a.click();
}

function animLoop() {
  if (state.anim) {
    state.tick += 0.12;
    renderAll();
  }
  requestAnimationFrame(animLoop);
}

initUI();
renderAll();
requestAnimationFrame(animLoop);
</script>
